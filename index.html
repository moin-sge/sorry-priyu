<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sorry Na</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=VT323&family=Yatra+One&display=swap">
<style>
/* Layout: one screen at a time, a single Y2K "window" centred on a bandhani-dot ground under a marigold toran; one big button moves the story forward. Single deliberate light look. */
:root{
  --rani:#D81B74; --rani-deep:#8E0C4C; --marigold:#FF9F1C; --haldi:#FFD23F;
  --peacock:#0B7A88; --tota:#3FA535; --blush:#FFF0F6; --ink:#3A0F2A; --ink-soft:#6E3A57;
  --paper:#FFFDF4; --rule:#B7CFF2; --margin-red:#EF6B7B;
  --lcd:#B9D98C; --lcd-ink:#1E3812; --phone:#2D3A5C; --phone-edge:#1A2340;
  --silver-1:#F4F6FB; --silver-2:#B9C0D2;
  --f-display:"Bagel Fat One","Baloo 2",system-ui,sans-serif;
  --f-deva:"Yatra One","Baloo 2",system-ui,sans-serif;
  --f-body:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Kalam","Baloo 2",cursive;
  --f-pixel:"VT323",ui-monospace,"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55;
  background-color:var(--rani);
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 0 1.6px,transparent 2.2px),
    radial-gradient(circle,rgba(255,255,255,.75) 0 1.6px,transparent 2.2px),
    radial-gradient(circle,rgba(255,255,255,.75) 0 1.6px,transparent 2.2px),
    radial-gradient(circle,rgba(255,255,255,.75) 0 1.6px,transparent 2.2px),
    radial-gradient(circle,rgba(255,210,63,.55) 0 2.4px,transparent 3px);
  background-size:36px 36px;
  background-position:18px 13px,18px 23px,13px 18px,23px 18px,0 0;
  overflow-x:hidden; display:flex; flex-direction:column;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--haldi);outline-offset:3px}

/* Toran */
.toran{flex:0 0 auto;display:flex;justify-content:center;gap:2px;height:58px;overflow:hidden;
  background:linear-gradient(var(--rani-deep),var(--rani-deep)) top/100% 6px no-repeat}
.toran .strand{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:22px}
.toran .leaf{width:14px;height:16px;background:var(--tota);border-radius:0 100% 0 100%;transform:rotate(45deg);margin-top:2px}
.toran .bead{width:20px;height:20px;border-radius:50%;margin-top:-3px;
  background:radial-gradient(circle at 35% 30%,#FFE58A 0 18%,var(--marigold) 45%,#E06A00 100%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.toran .bead.y{background:radial-gradient(circle at 35% 30%,#FFF6B8 0 18%,var(--haldi) 50%,#E2A800 100%)}

.stage{flex:1 0 auto;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-pixel);font-size:20px;color:#fff;letter-spacing:.04em}
.topbar button{background:rgba(58,15,42,.35);border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:2px 14px;cursor:pointer;font-family:var(--f-pixel);font-size:19px;color:#fff}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);border:1.5px solid rgba(58,15,42,.4)}
.dots i.on{background:var(--haldi);border-color:var(--ink)}

/* Window */
.win{background:var(--blush);border:3px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.win-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px 5px 12px;
  background:linear-gradient(90deg,var(--marigold),var(--rani) 70%,var(--rani-deep));border-bottom:3px solid var(--ink);
  font-family:var(--f-pixel);font-size:21px;color:#fff;letter-spacing:.04em;text-shadow:1px 1px 0 var(--ink)}
.win-bar .ctl{display:flex;gap:5px}
.win-bar .ctl i{width:20px;height:18px;border:2px solid var(--ink);border-radius:5px;background:linear-gradient(var(--silver-1),var(--silver-2));display:block}
.win-body{padding:22px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;min-height:430px;justify-content:center}
.screen{animation:in .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{transform:translateY(14px) scale(.97);opacity:.4}to{transform:none;opacity:1}}

h1,h2,p{margin:0}
.chrome{font-family:var(--f-display);font-weight:400;font-size:clamp(64px,20vw,104px);line-height:.88;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 0%,#FFE0EE 34%,#FF7FB8 50%,#FFF4FA 64%,#FFC4DF 82%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px var(--rani-deep);
  filter:drop-shadow(0 4px 0 var(--rani-deep));text-wrap:balance}
.deva{font-family:var(--f-deva);font-size:clamp(28px,8vw,38px);color:var(--marigold);text-shadow:0 3px 0 var(--ink)}
.title{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;color:var(--rani);text-wrap:balance}
.lead{color:var(--ink-soft);font-size:17px;max-width:32ch}
.pix{font-family:var(--f-pixel);font-size:22px;color:var(--ink-soft);letter-spacing:.03em}
.pix b{color:var(--rani);font-weight:400}

.sparks{position:relative;display:inline-block}
.sparkle{position:absolute;width:22px;height:22px;background:var(--haldi);pointer-events:none;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.1) rotate(20deg);opacity:1}}

/* Phone */
.phone{width:168px;background:linear-gradient(160deg,#4A5A86,var(--phone) 45%,var(--phone-edge));border-radius:46px 46px 40px 40px;
  padding:18px 14px 16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),6px 6px 0 var(--ink);transform:rotate(-3deg)}
.phone .speaker{width:40px;height:5px;border-radius:3px;background:var(--phone-edge);margin:0 auto 10px}
.lcd{background:var(--lcd);border-radius:8px;height:132px;padding:7px 8px;font-family:var(--f-pixel);color:var(--lcd-ink);font-size:19px;line-height:1.05;text-align:left;
  box-shadow:inset 0 0 0 2px #8FB063,inset 2px 2px 6px rgba(0,0,0,.18);overflow:hidden}
.lcd .bar{display:flex;justify-content:space-between;font-size:15px;border-bottom:1px solid rgba(30,56,18,.4);padding-bottom:2px;margin-bottom:5px}
.lcd .msg{white-space:pre-wrap;word-break:break-word}
.lcd .caret{display:inline-block;width:7px;height:14px;background:var(--lcd-ink);vertical-align:-1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.keys span{height:15px;border-radius:8px;background:linear-gradient(#C9D2EA,#8E9AC0);box-shadow:0 2px 0 var(--phone-edge)}
.keys span.nav{grid-column:2;height:20px;border-radius:10px;background:linear-gradient(#FFD9EA,#FF8DBF)}

/* Letter */
.paper{width:100%;text-align:left;background-color:var(--paper);border:2px solid var(--ink);border-radius:6px;
  background-image:linear-gradient(90deg,transparent 34px,var(--margin-red) 34px,var(--margin-red) 36px,transparent 36px),
    repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 0,0 12px;padding:12px 14px 14px 46px;font-family:var(--f-hand);font-size:18px;line-height:32px;color:#1E2F78}
.paper p{margin:0 0 32px}
.paper p:last-child{margin:0}
.paper .sign{font-weight:700;color:var(--rani-deep)}

/* Kaan pakad */
.boy-svg{width:130px;height:auto;overflow:visible}
#boy{transform-origin:60px 150px;transition:transform .18s ease-in}
#boy.squat{transform:translateY(16px) scaleY(.9)}
.counter{font-family:var(--f-pixel);font-size:72px;line-height:.85;color:var(--rani-deep)}
.counter small{display:block;font-size:20px;color:var(--ink-soft)}
.track{width:100%;height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.track i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--marigold) 0 8px,var(--haldi) 8px 16px);transition:width .2s}

/* Promise / coupon card */
.card{width:100%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:22px 18px;box-shadow:4px 4px 0 var(--ink)}
.card .k{font-family:var(--f-pixel);font-size:18px;color:var(--peacock);letter-spacing:.06em}
.card .v{font-weight:800;font-size:23px;line-height:1.25;margin-top:4px;text-wrap:balance}
.card .n{color:var(--ink-soft);margin-top:6px}
.coupon{border-style:dashed;background:linear-gradient(135deg,#fff 0 70%,#FFF4D6)}
.coupon .stamp{display:inline-block;margin-top:12px;font-family:var(--f-pixel);font-size:18px;color:var(--rani);border:2px solid var(--rani);border-radius:4px;padding:0 8px;transform:rotate(-5deg)}

.gift{width:120px;height:110px;position:relative}
.gift .box{position:absolute;left:10px;right:10px;bottom:0;height:70px;background:var(--rani);border:3px solid var(--ink);border-radius:8px}
.gift .lid{position:absolute;left:2px;right:2px;top:20px;height:24px;background:var(--marigold);border:3px solid var(--ink);border-radius:6px;transition:transform .3s}
.gift .rib{position:absolute;left:50%;width:16px;margin-left:-8px;top:20px;bottom:0;background:var(--haldi);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.gift .bow{position:absolute;top:0;left:50%;width:46px;height:26px;margin-left:-23px;border:3px solid var(--ink);border-radius:50% 50% 8px 8px;background:var(--haldi)}
.gift.open .lid{transform:translateY(-14px) rotate(-12deg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;min-width:200px;padding:6px 26px;border-radius:999px;border:3px solid var(--ink);cursor:pointer;
  font-family:var(--f-body);font-weight:800;font-size:20px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn-rani{background:linear-gradient(180deg,#FF5FA2,var(--rani));color:#fff;text-shadow:1px 1px 0 var(--rani-deep)}
.btn-haldi{background:linear-gradient(180deg,#FFE680,var(--haldi));color:var(--ink)}
.btn-plain{background:#fff;color:var(--ink);min-width:0}
.choices{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;min-height:110px;width:100%}
.choices .btn{min-width:120px}
#haan,#nahi{transition:transform .2s}

.reply{width:100%;font-family:var(--f-hand);font-size:18px;line-height:1.5;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--paper);color:#1E2F78;resize:none;text-align:left}
.copied{font-family:var(--f-pixel);font-size:19px;color:var(--tota)}
.link-btn{background:none;border:0;cursor:pointer;font-family:var(--f-pixel);font-size:19px;color:var(--ink-soft);text-decoration:underline}

footer{text-align:center;font-family:var(--f-pixel);font-size:18px;color:#fff;text-shadow:1px 1px 0 var(--rani-deep)}

#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="toran" id="toran" aria-hidden="true"></div>

<main class="stage">
  <div class="topbar">
    <span class="dots" id="dots" aria-hidden="true"></span>
    <button type="button" id="soundBtn" aria-pressed="true">awaaz: on</button>
  </div>
  <section class="win" aria-live="polite">
    <div class="win-bar"><span id="winTitle">maafi.exe</span><span class="ctl" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <div class="win-body screen" id="screen"></div>
  </section>
  <footer>chai aur guilt se banaya, <span class="his-name">Moin</span> ne</footer>
</main>

<canvas id="petals" aria-hidden="true"></canvas>

<script>
(function(){
  /* ---------- Personalise ---------- */
  var FROM = "Moin";
  var DEFAULT_NAME = "Priyu";
  var REASON = "";   // one line about what actually happened; "" skips it

  function herName(){
    var h = "";
    try { h = decodeURIComponent((location.hash || "").slice(1)).replace(/[-_]+/g," ").trim(); } catch(e){}
    return h ? h.charAt(0).toUpperCase() + h.slice(1) : DEFAULT_NAME;
  }
  var NAME = herName();
  var $ = function(id){ return document.getElementById(id); };
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ---------- Toran ---------- */
  (function(){
    var n = Math.ceil(Math.min(window.innerWidth, 1400) / 24) + 2, html = "";
    for (var i = 0; i < n; i++){
      var len = 2 + (i % 3 === 1 ? 1 : 0);
      html += '<div class="strand"><div class="leaf"></div>';
      for (var j = 0; j < len; j++) html += '<div class="bead' + ((i + j) % 2 ? ' y' : '') + '"></div>';
      html += '</div>';
    }
    $("toran").innerHTML = html;
  })();

  /* ---------- Sound ---------- */
  var soundOn = true, ctx = null;
  function tone(freq, dur, vol, type, when){
    if (!soundOn) return;
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    var t0 = ctx.currentTime + (when || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function tick(){ tone(880, .12, .08, "triangle"); }
  function ghanti(){ [1046, 2093, 2637, 3520].forEach(function(f, i){ tone(f, 1.8 - i * .3, .12 / (i + 1)); }); }
  function ghungroo(){ for (var i = 0; i < 7; i++) tone(3000 + Math.random() * 2500, .18, .05, "sine", i * .07); }
  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn; this.textContent = "awaaz: " + (soundOn ? "on" : "off"); this.setAttribute("aria-pressed", soundOn); if (soundOn) tick();
  });

  /* ---------- Content ---------- */
  var SORRY_GOAL = 11;
  var SORRY_LINES = {1:"Pehla sorry.",3:"Ghutne abhi theek hain.",5:"Aadhe raste.",7:"Pasina aa raha hai.",9:"Bas do aur.",11:"11 sorry. Shagun poora."};
  var PROMISES = [
    { v:"Pehle poori baat sununga, phir bolunga", n:"Beech mein nahi kaatunga. Promise." },
    { v:"Gussa hoge toh space dunga, ghost nahi karunga", n:"Main yahin hoon, jab bhi tum taiyaar ho." },
    { v:"Saath ho toh phone side mein", n:"Tum mere saamne ho, reels baad mein." },
    { v:"Tumhari feelings ko “overthinking” nahi bolunga", n:"Jo tumhe lagta hai, woh important hai." }
  ];
  var COUPONS = [
    { v:"Golgappa date", n:"Unlimited plates. Tum bas “bhaiya ek aur” bolna." },
    { v:"Movie tumhari choice", n:"3 ghante wali bhi, bina complain." },
    { v:"Raat 1 baje Maggi", n:"Main banaunga, bartan bhi main dhounga." },
    { v:"Full rant session", n:"Tum bolo, main sirf “haan” bolunga." }
  ];
  var NAHI = ["Nahi", "Pakka?", "Pakka pakka?", "Mummy kasam?", "Ek golgappa aur?", "Dil pe haath rakh ke?", "Accha... theek hai", "nahi"];

  var s = { sorry:0, promise:0, coupon:-1, nahi:0 };
  var SCREENS = ["sms", "hello", "letter", "kaan", "vaade", "gift", "ask", "yay"];
  var at = 0;

  var BOY = '<svg class="boy-svg" viewBox="0 0 120 165" role="img" aria-label="A boy holding his ears, doing sit-ups">' +
    '<ellipse cx="60" cy="160" rx="34" ry="4" fill="rgba(58,15,42,.18)"/><g id="boy">' +
    '<rect x="44" y="118" width="11" height="36" rx="5" fill="#3A0F2A"/><rect x="65" y="118" width="11" height="36" rx="5" fill="#3A0F2A"/>' +
    '<rect x="34" y="70" width="52" height="58" rx="18" fill="#0B7A88" stroke="#3A0F2A" stroke-width="3"/><rect x="57" y="74" width="6" height="22" rx="3" fill="#FFD23F"/>' +
    '<line x1="38" y1="80" x2="27" y2="44" stroke="#C98A5E" stroke-width="10" stroke-linecap="round"/><line x1="82" y1="80" x2="93" y2="44" stroke="#C98A5E" stroke-width="10" stroke-linecap="round"/>' +
    '<circle cx="60" cy="42" r="28" fill="#D9A273" stroke="#3A0F2A" stroke-width="3"/><path d="M33 36 Q38 12 60 13 Q84 12 88 36 Q76 24 60 26 Q44 24 33 36Z" fill="#3A0F2A"/>' +
    '<circle cx="30" cy="44" r="7" fill="#D9A273" stroke="#3A0F2A" stroke-width="3"/><circle cx="90" cy="44" r="7" fill="#D9A273" stroke="#3A0F2A" stroke-width="3"/>' +
    '<circle cx="27" cy="44" r="6" fill="#C98A5E"/><circle cx="93" cy="44" r="6" fill="#C98A5E"/>' +
    '<path d="M46 44 q5 -4 10 0" stroke="#3A0F2A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M64 44 q5 -4 10 0" stroke="#3A0F2A" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<circle cx="45" cy="53" r="5" fill="#FF7FB8" opacity=".7"/><circle cx="75" cy="53" r="5" fill="#FF7FB8" opacity=".7"/>' +
    '<path d="M54 60 q6 -5 12 0" stroke="#3A0F2A" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="60" cy="31" r="2.6" fill="#D81B74"/></g></svg>';

  function btn(id, label, cls){ return '<button type="button" class="btn ' + (cls || "btn-rani") + '" id="' + id + '">' + label + '</button>'; }

  var VIEWS = {
    sms: function(){ return { t:"inbox", h:
      '<div class="phone" aria-label="Phone with a new message"><div class="speaker"></div><div class="lcd" role="status">' +
      '<div class="bar"><span>▮▮▮▯</span><span>' + clock() + '</span></div><div class="msg"><span id="sms"></span><span class="caret"></span></div></div>' +
      '<div class="keys" aria-hidden="true"><span class="nav"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>' +
      btn("next", "Message padho"), after: typeSms }; },
    hello: function(){ return { t:"maafi.exe", h:
      '<span class="sparks"><span class="sparkle" style="left:-14px;top:-10px"></span><span class="sparkle" style="right:-12px;top:30%;animation-delay:.8s;width:16px;height:16px"></span>' +
      '<h1 class="chrome">Sorry na</h1></span><p class="deva" lang="hi">माफ़ कर दो ना</p>' +
      '<p class="pix">for <b>' + esc(NAME) + '</b>, from <b>' + esc(FROM) + '</b></p>' + btn("next", "Aage") }; },
    letter: function(){
      var p = ["Dear " + esc(NAME) + ",", "Main jaanta hoon maine tumhe hurt kiya. Koi bahana nahi, koi “par tumne bhi” nahi. Galti meri thi."];
      if (REASON) p.push(esc(REASON));
      p.push("Tumhara gussa jaayaz hai. Tum meri sabse important insaan ho, aur main better karunga. Bolke nahi, karke.",
             'Sorry, sach mein.<br><span class="sign">— ' + esc(FROM) + '</span>');
      return { t:"chitthi.txt", h:'<h2 class="title">Pehle yeh padh lo</h2><div class="paper">' + p.map(function(x){ return "<p>" + x + "</p>"; }).join("") + '</div>' + btn("next", "Padh liya") };
    },
    kaan: function(){
      var done = s.sorry >= SORRY_GOAL;
      return { t:"kaan_pakad.exe", h:
        '<h2 class="title">Kaan pakad ke sorry</h2><p class="lead">Har tap pe ek uthak-baithak. Shagun ke 11.</p>' + BOY +
        '<div class="counter"><span id="cnt">' + s.sorry + '</span><small id="cntLine">' + (sorryLine() || "tap karo") + '</small></div>' +
        '<div class="track" aria-hidden="true"><i id="trk" style="width:' + Math.min(100, s.sorry / SORRY_GOAL * 100) + '%"></i></div>' +
        (done ? btn("next", "Aage", "btn-haldi") : btn("sorry", "Kaan pakad ke sorry")) };
    },
    vaade: function(){
      var p = PROMISES[s.promise], last = s.promise === PROMISES.length - 1;
      return { t:"vaade.doc", h:
        '<h2 class="title">Mere vaade</h2><p class="pix">vaada ' + (s.promise + 1) + ' / ' + PROMISES.length + '</p>' +
        '<div class="card screen"><div class="k">VAADA #' + (s.promise + 1) + '</div><div class="v">' + esc(p.v) + '</div><div class="n">' + esc(p.n) + '</div></div>' +
        (last ? btn("next", "Aage", "btn-haldi") : btn("promise", "Agla vaada")) };
    },
    gift: function(){
      if (s.coupon < 0) return { t:"tohfa.zip", h:
        '<h2 class="title">Tumhare liye kuch hai</h2><div class="gift" id="giftBox" aria-hidden="true"><div class="box"></div><div class="rib"></div><div class="lid"></div><div class="bow"></div></div>' +
        '<p class="lead">4 maafi coupons. Lifetime valid, kabhi bhi redeem karo.</p>' + btn("coupon", "Tohfa kholo") };
      var c = COUPONS[s.coupon], last = s.coupon === COUPONS.length - 1;
      return { t:"maafi_coupons", h:
        '<h2 class="title">Coupon ' + (s.coupon + 1) + ' / ' + COUPONS.length + '</h2>' +
        '<div class="card coupon screen"><div class="k">MAAFI COUPON</div><div class="v">' + esc(c.v) + '</div><div class="n">' + esc(c.n) + '</div><span class="stamp">TUMHARA</span></div>' +
        (last ? btn("next", "Aage", "btn-haldi") : btn("coupon", "Agla coupon")) };
    },
    ask: function(){ return { t:"final_sawaal", h:
      '<span class="sparks"><span class="sparkle" style="left:-16px;top:-6px"></span><p class="chrome" style="font-size:clamp(46px,14vw,64px)">Toh...</p></span>' +
      '<h2 class="title">maaf kiya?</h2><p class="lead">Soch samajh ke jawab dena, ' + esc(NAME) + '.</p>' +
      '<div class="choices">' + btn("haan", "Haan") + btn("nahi", NAHI[0], "btn-plain") + '</div>' }; },
    yay: function(){
      var reply = "Theek hai " + FROM + ", maaf kiya. Par golgappe tum khilaoge, aur vaade yaad rakhna. — " + NAME;
      return { t:"yayyy.exe", h:
        '<span class="sparks"><span class="sparkle" style="left:-14px;top:-8px"></span><span class="sparkle" style="right:-14px;bottom:0;animation-delay:1s"></span><h2 class="chrome" style="font-size:clamp(52px,15vw,78px)">Yayyy</h2></span>' +
        '<p class="deva" lang="hi">दोस्ती, प्यार, सब वापस</p>' +
        '<p class="lead">Yeh jawab ' + esc(FROM) + ' ko bhej do:</p>' +
        '<label for="reply" class="sr">Reply to send</label><textarea class="reply" id="reply" rows="3" readonly>' + esc(reply) + '</textarea>' +
        btn("copy", "Copy karo", "btn-haldi") + '<span class="copied" id="copied" hidden></span>' +
        '<button type="button" class="link-btn" id="restart">shuru se dekho</button>', after: function(){ ghanti(); setTimeout(ghungroo, 250); burst(180); } };
    }
  };

  function sorryLine(){ var l = ""; Object.keys(SORRY_LINES).map(Number).forEach(function(k){ if (s.sorry >= k) l = SORRY_LINES[k]; }); return l; }
  function clock(){ var d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
  var smsTimer;
  function typeSms(){
    var text = "1 naya message\n" + FROM + ":\nSorry na " + NAME + " :(", el = $("sms"), i = 0;
    clearInterval(smsTimer);
    if (reduced) { el.textContent = text; return; }
    smsTimer = setInterval(function(){ if (!el.isConnected) return clearInterval(smsTimer); el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(smsTimer); }, 50);
  }

  function render(focus){
    var v = VIEWS[SCREENS[at]](), sc = $("screen");
    $("winTitle").textContent = v.t;
    sc.innerHTML = v.h;
    sc.classList.remove("screen"); void sc.offsetWidth; sc.classList.add("screen");
    $("dots").innerHTML = SCREENS.map(function(_, i){ return '<i class="' + (i <= at ? "on" : "") + '"></i>'; }).join("");
    document.querySelectorAll(".his-name").forEach(function(el){ el.textContent = FROM; });
    if (v.after) v.after();
    if (focus) { var b = sc.querySelector(".btn"); if (b) b.focus({ preventScroll:true }); }
  }
  function go(){ if (at < SCREENS.length - 1) { at++; tick(); render(true); window.scrollTo(0, 0); } }

  $("screen").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    switch (b.id){
      case "next": go(); break;
      case "sorry":
        s.sorry++;
        var boy = $("boy"); if (boy) { boy.classList.add("squat"); setTimeout(function(){ boy.classList.remove("squat"); }, 180); }
        if (s.sorry >= SORRY_GOAL) { ghungroo(); burst(50); render(true); }
        else { tick(); $("cnt").textContent = s.sorry; $("cntLine").textContent = sorryLine(); $("trk").style.width = (s.sorry / SORRY_GOAL * 100) + "%"; }
        break;
      case "promise": s.promise++; tick(); render(true); break;
      case "coupon":
        if (s.coupon < 0) { var g = $("giftBox"); if (g) g.classList.add("open"); ghungroo(); burst(40); setTimeout(function(){ s.coupon = 0; render(true); }, reduced ? 0 : 350); }
        else { s.coupon++; tick(); render(true); }
        break;
      case "nahi":
        s.nahi = Math.min(s.nahi + 1, NAHI.length - 1);
        b.textContent = NAHI[s.nahi];
        b.style.transform = "scale(" + Math.max(.55, 1 - s.nahi * .07) + ")";
        $("haan").style.transform = "scale(" + (1 + s.nahi * .14) + ")";
        tone(330 - s.nahi * 20, .2, .08, "triangle");
        break;
      case "haan": go(); break;
      case "copy":
        var t = $("reply"), msg = $("copied");
        var ok = function(){ msg.textContent = "copy ho gaya"; msg.hidden = false; };
        var fb = function(){ t.focus(); t.select(); try { document.execCommand("copy"); } catch(_){} msg.textContent = "select ho gaya, ab copy karo"; msg.hidden = false; };
        try { navigator.clipboard.writeText(t.value).then(ok, fb); } catch(_){ fb(); }
        break;
      case "restart": at = 0; s = { sorry:0, promise:0, coupon:-1, nahi:0 }; render(true); break;
    }
  });

  /* ---------- Marigold petal shower ---------- */
  var pc = $("petals"), pg = pc.getContext("2d"), petals = [], raf = null;
  function sizePetals(){ var d = Math.max(1, window.devicePixelRatio || 1); pc.width = innerWidth * d; pc.height = innerHeight * d; pg.setTransform(d,0,0,d,0,0); }
  sizePetals(); window.addEventListener("resize", sizePetals);
  var COLORS = ["#FF9F1C","#FFD23F","#E06A00","#FFB347","#D81B74"];
  function burst(n){
    if (reduced || !n) return;
    for (var i = 0; i < n; i++) petals.push({ x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .6, r:5 + Math.random() * 6,
      vy:1.4 + Math.random() * 2.2, vx:-.6 + Math.random() * 1.2, a:Math.random() * 6.28, va:-.08 + Math.random() * .16, sway:Math.random() * 6.28, c:COLORS[(Math.random() * COLORS.length) | 0] });
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step(){
    pg.clearRect(0,0,innerWidth,innerHeight);
    petals = petals.filter(function(p){ return p.y < innerHeight + 30; });
    petals.forEach(function(p){
      p.y += p.vy; p.sway += .03; p.x += p.vx + Math.sin(p.sway) * .8; p.a += p.va;
      pg.save(); pg.translate(p.x, p.y); pg.rotate(p.a); pg.fillStyle = p.c;
      pg.beginPath(); pg.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); pg.fill();
      pg.fillStyle = "rgba(255,255,255,.35)"; pg.beginPath(); pg.ellipse(-p.r * .25, -p.r * .1, p.r * .35, p.r * .15, 0, 0, Math.PI * 2); pg.fill();
      pg.restore();
    });
    raf = petals.length ? requestAnimationFrame(step) : null;
  }

  window.addEventListener("hashchange", function(){ NAME = herName(); render(false); });
  render(false);
})();
</script>
</body>
</html>
